name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: A minimal script that reproduces it
      render: python
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Backend, model, server and version (for vLLM, the full `vllm serve` command), Python and vlm-listwise-rerank versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      render: text
  - type: markdown
    attributes:
      value: Please leave out API keys and private data.
