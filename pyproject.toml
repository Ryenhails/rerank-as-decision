[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-listwise-rerank"
version = "0.1.0"
description = "Multimodal reranking as a System One decision: one choice question over the candidates, read from one forward pass of a vision-language model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Zhuchenyang Liu" },
    { name = "Yao Zhang" },
    { name = "Yu Xiao" },
]
keywords = ["ranking", "reranking", "multimodal retrieval", "visual document retrieval", "vision-language model", "zero-shot", "system-one", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# ChatBackend maps the labels to token ids with the model's tokenizer
client = ["transformers>=4.57"]
# scripts/: ViDoRe V3 from the Hub as parquet, the Qwen3-VL-Embedding loaders' config files
eval = ["transformers>=4.57", "huggingface_hub>=0.30", "pyarrow>=15", "pyyaml>=6"]
dev = ["pytest>=8", "ruff"]

[project.urls]
Homepage = "https://github.com/Ryenhails/vlm-listwise-rerank"
Repository = "https://github.com/Ryenhails/vlm-listwise-rerank"
Changelog = "https://github.com/Ryenhails/vlm-listwise-rerank/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["listwise_rerank*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
